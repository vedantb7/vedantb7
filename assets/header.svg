<svg width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0f1923;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>

    <!-- Cyan glow gradient for accent elements -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0000ff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#7c3aed;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0000ff;stop-opacity:0"/>
    </linearGradient>

    <!-- Name text gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>

    <!-- Cyan-purple mesh gradient -->
    <radialGradient id="meshGlow1" cx="20%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="meshGlow2" cx="80%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <!-- Filter: blur for glow effect -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      /* ── Animations ─────────────────────────────────────────── */
      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; r: 5px; }
        50%       { opacity: 0.6; r: 7px; }
      }
      @keyframes scanline {
        0%   { transform: translateX(-100%); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateX(100%); opacity: 0; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.6; }
        50%       { opacity: 1; }
      }
      @keyframes typeCursor {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }
      @keyframes meshShift {
        0%   { transform: scale(1)   translateX(0px);  }
        50%  { transform: scale(1.1) translateX(15px); }
        100% { transform: scale(1)   translateX(0px);  }
      }
      @keyframes lineExpand {
        from { stroke-dashoffset: 850; }
        to   { stroke-dashoffset: 0; }
      }

      /* ── Element classes ────────────────────────────────────── */
      .bg-rect     { animation: fadeIn 0.5s ease forwards; }
      .mesh1       { animation: meshShift 8s ease-in-out infinite; }
      .mesh2       { animation: meshShift 10s ease-in-out infinite reverse; }
      .top-line    { stroke-dasharray: 850; stroke-dashoffset: 850;
                     animation: lineExpand 1.2s ease 0.2s forwards; }
      .bottom-line { stroke-dasharray: 850; stroke-dashoffset: 850;
                     animation: lineExpand 1.2s ease 0.4s forwards; }
      .name-text   { opacity: 0;
                     animation: fadeInDown 0.9s cubic-bezier(0.22,1,0.36,1) 0.5s forwards; }
      .role-text   { opacity: 0;
                     animation: fadeInUp 0.9s cubic-bezier(0.22,1,0.36,1) 0.8s forwards; }
      .tag-text    { opacity: 0;
                     animation: fadeIn 0.8s ease 1.2s forwards; }
      .status-dot  { animation: pulse 2s ease-in-out 1.4s infinite; }
      .status-text { opacity: 0;
                     animation: fadeIn 0.6s ease 1.5s forwards; }
      .scanbar     { animation: scanline 4s linear 1.8s infinite; }
      .glow-line   { animation: glowPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ── Background ───────────────────────────────────────────── -->
  <rect class="bg-rect" width="850" height="220" rx="12" fill="url(#bgGrad)"/>
  <rect width="850" height="220" rx="12" fill="url(#dots)"/>

  <!-- Ambient mesh glow blobs -->
  <ellipse class="mesh1" cx="170" cy="110" rx="200" ry="120" fill="url(#meshGlow1)"/>
  <ellipse class="mesh2" cx="680" cy="110" rx="200" ry="120" fill="url(#meshGlow2)"/>

  <!-- Soft scanbar sweep -->
  <rect class="scanbar" x="0" y="0" width="120" height="220" rx="12"
        fill="url(#glowLine)" opacity="0.06"/>

  <!-- ── Decorative accent lines ──────────────────────────────── -->
  <line class="top-line" x1="40" y1="28" x2="810" y2="28"
        stroke="url(#glowLine)" stroke-width="1" opacity="0.4"/>
  <line class="bottom-line" x1="40" y1="192" x2="810" y2="192"
        stroke="url(#glowLine)" stroke-width="1" opacity="0.4"/>

  <!-- Corner brackets — top-left -->
  <polyline points="40,50 40,28 62,28" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner brackets — top-right -->
  <polyline points="788,28 810,28 810,50" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner brackets — bottom-left -->
  <polyline points="40,170 40,192 62,192" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner brackets — bottom-right -->
  <polyline points="788,192 810,192 810,170" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>

  <!-- ── Terminal prefix glyph ─────────────────────────────────── -->
  <text x="58" y="92" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace"
        font-size="15" fill="#00d4ff" opacity="0.6"
        style="animation: fadeIn 0.6s ease 0.3s both;">~/vedantb7 $</text>

  <!-- ── Name ─────────────────────────────────────────────────── -->
  <text class="name-text" x="425" y="115"
        font-family="'Segoe UI', 'Inter', 'SF Pro Display', system-ui, sans-serif"
        font-size="42" font-weight="700" text-anchor="middle"
        fill="url(#nameGrad)" filter="url(#textGlow)"
        letter-spacing="1">Vedant Bondekar</text>

  <!-- ── Role subtitle ─────────────────────────────────────────── -->
  <text class="role-text" x="425" y="145"
        font-family="'JetBrains Mono', 'Fira Code', monospace"
        font-size="14" text-anchor="middle"
        fill="#94a3b8" letter-spacing="2">
    B.Tech CSE · IIT Gandhinagar  ·  Systems · Security · Full-Stack
  </text>

  <!-- ── Glowing separator line ────────────────────────────────── -->
  <line class="glow-line" x1="280" y1="158" x2="570" y2="158"
        stroke="url(#glowLine)" stroke-width="1" opacity="0.5"/>

  <!-- ── Status indicator ──────────────────────────────────────── -->
  <circle class="status-dot" cx="310" cy="175" r="5" fill="#22c55e"/>
  <text class="status-text" x="323" y="179"
        font-family="'JetBrains Mono', 'Fira Code', monospace"
        font-size="12" fill="#4ade80" letter-spacing="1">available for opportunities</text>

  <!-- ── Subtle vertical grid lines ───────────────────────────── -->
  <line x1="210" y1="35" x2="210" y2="185" stroke="#00d4ff" stroke-width="0.3" opacity="0.08"/>
  <line x1="640" y1="35" x2="640" y2="185" stroke="#7c3aed" stroke-width="0.3" opacity="0.08"/>
</svg>
